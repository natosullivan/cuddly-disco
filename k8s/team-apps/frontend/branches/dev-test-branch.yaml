# Manual test for branch-based deployment system
# Branch: test-branch (manual test)
# Generated: Manual creation for Task 1 testing

# Version configuration
version:
  name: "test-branch"
  isDefault: false  # Requires X-Version: test-branch header

# Namespace configuration
namespace:
  create: false  # Reuse existing namespace from v1 deployment

# Image configuration (using same image as v1 for initial test)
image:
  repository: ghcr.io/natosullivan/cuddly-disco/frontend
  tag: "v1.3.0"  # Using existing v1 image for testing
  pullPolicy: Always

# Single replica for branch versions
replicaCount: 1

# Dev gateway hostname
gateway:
  hostname: dev.cuddly-disco.ai.localhost

# Frontend configuration
config:
  location: "Development (branch: test-branch)"
  backendUrl: "http://backend-dev-v1-backend-app.backend.svc.cluster.local:5000"

# Lower resource limits for branch versions
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
