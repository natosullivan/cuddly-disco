# Template for branch-based deployments in dev environment
# This file is NOT deployed directly - copy and customize for your branch
#
# Example: For branch "feature/add-user-auth" → values-dev-add-user-auth.yaml
#
# Auto-generated by CI (Task 3), but can be created manually for testing

# Version configuration
version:
  name: "BRANCH-NAME"        # REPLACE: Sanitized branch name (e.g., "add-user-auth")
  isDefault: false            # Branch versions require X-Version header

# Namespace configuration
namespace:
  create: false               # Reuse existing namespace from v1 deployment

# Image configuration
image:
  repository: ghcr.io/natosullivan/cuddly-disco/frontend
  tag: "vX.X.X-BRANCH-NAME"   # REPLACE: Branch-specific image tag (e.g., "v1.3.0-add-user-auth")
  pullPolicy: Always          # Always pull to get latest branch builds

# Single replica for branch versions
replicaCount: 1

# Dev gateway hostname (same as v1, routing by header)
gateway:
  hostname: dev.cuddly-disco.ai.localhost

# Frontend configuration
config:
  location: "Development (branch: BRANCH-NAME)"  # REPLACE: Identifies branch in UI
  # Backend URL - choose based on what changed:
  # - If ONLY frontend changed: Use default backend (uncomment line below)
  backendUrl: "http://backend-dev-v1-backend-app.backend.svc.cluster.local:5000"
  # - If BOTH frontend and backend changed: Use branch backend (uncomment line below)
  # backendUrl: "http://backend-dev-BRANCH-NAME-backend-app.backend.svc.cluster.local:5000"

# Lower resource limits for branch versions (saves cluster resources)
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
