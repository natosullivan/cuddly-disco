apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: team-apps-branches
  namespace: argocd
spec:
  # Use Git file generator to discover branch values files automatically
  # Matches files in branches/ subdirectory: dev-*.yaml and prod-*.yaml
  # Static versions (values-dev.yaml) use the main team-apps ApplicationSet
  # Template files (TEMPLATE-*.yaml) won't match the pattern
  generators:
  - git:
      repoURL: https://github.com/natosullivan/cuddly-disco.git
      revision: feature/branch-versioning  # TODO: Change to HEAD before merging to main
      files:
      - path: "k8s/team-apps/*/branches/dev-*.yaml"

  # Template to generate Applications for each branch version
  template:
    metadata:
      # Extract app name from path[2] and version from filename
      # path = [k8s, team-apps, frontend, branches] (directory only, excludes filename)
      # path[2] = frontend
      # path.filenameNormalized = dev-test-branch (filename without .yaml)
      # Result: frontend-dev-test-branch
      name: '{{path[2]}}-{{path.filenameNormalized}}'
      labels:
        team: '{{path[2]}}'
        environment: dev
        type: branch-version
    spec:
      project: default

      source:
        repoURL: https://github.com/natosullivan/cuddly-disco.git
        targetRevision: feature/branch-versioning  # TODO: Change to HEAD before merging to main
        path: 'k8s/team-apps/{{path[2]}}'
        helm:
          valueFiles:
          - values.yaml
          - 'branches/{{path.filename}}'  # e.g., branches/dev-test-branch.yaml

      destination:
        name: kind-dev
        namespace: '{{path[2]}}'

      syncPolicy:
        automated:
          prune: true      # Auto-delete when values file removed
          selfHeal: true
        syncOptions:
        - CreateNamespace=false  # Branch versions reuse existing namespace
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
