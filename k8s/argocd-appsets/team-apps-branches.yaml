apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: team-apps-branches
  namespace: argocd
spec:
  # Use Git file generator to discover branch values files automatically
  # Note: This will match all values-dev-*.yaml files
  # Static versions (values-dev.yaml) use the main team-apps ApplicationSet
  # Template files are named *-TEMPLATE.yaml to avoid matching
  generators:
  - git:
      repoURL: https://github.com/natosullivan/cuddly-disco.git
      revision: feature/branch-versioning  # TODO: Change to HEAD before merging to main
      files:
      - path: "k8s/team-apps/*/values-dev-*.yaml"

  # Template to generate Applications for each branch version
  template:
    metadata:
      # Extract app name from path[2] and version from filename
      # path = [k8s, team-apps, frontend, values-dev-test-branch.yaml]
      # path[2] = frontend
      # path.basenameNormalized = values-dev-test-branch (without .yaml)
      # We want: frontend-dev-test-branch
      name: '{{path[2]}}-{{path.basenameNormalized}}'
      labels:
        team: '{{path[2]}}'
        environment: dev
        type: branch-version
    spec:
      project: default

      source:
        repoURL: https://github.com/natosullivan/cuddly-disco.git
        targetRevision: feature/branch-versioning  # TODO: Change to HEAD before merging to main
        path: 'k8s/team-apps/{{path[2]}}'
        helm:
          valueFiles:
          - values.yaml
          - '{{path.filename}}'  # e.g., values-dev-test-branch.yaml

      destination:
        name: kind-dev
        namespace: '{{path[2]}}'

      syncPolicy:
        automated:
          prune: true      # Auto-delete when values file removed
          selfHeal: true
        syncOptions:
        - CreateNamespace=false  # Branch versions reuse existing namespace
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
