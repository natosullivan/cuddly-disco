apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: team-apps-branches
  namespace: argocd
spec:
  # Use Git file generator to discover branch values files automatically
  # Excludes static version files (values-dev.yaml, values-dev-v1.yaml, values-dev-v2.yaml)
  generators:
  - git:
      repoURL: https://github.com/natosullivan/cuddly-disco.git
      revision: HEAD
      files:
      - path: "k8s/team-apps/*/values-dev-*.yaml"
        exclude: "{values-dev.yaml,values-dev-v[0-9].yaml,values-dev-v[0-9][0-9].yaml,*TEMPLATE*}"

  # Template to generate Applications for each branch version
  template:
    metadata:
      # Extract app name from path[2] and version from filename
      # path = [k8s, team-apps, frontend, values-dev-test-branch.yaml]
      # So path[2] = frontend, and we extract the version from path.filename
      name: '{{path[2]}}-dev-{{path.filenameNormalized}}'
      labels:
        team: '{{path[2]}}'
        environment: dev
        type: branch-version
    spec:
      project: default

      source:
        repoURL: https://github.com/natosullivan/cuddly-disco.git
        targetRevision: HEAD
        path: 'k8s/team-apps/{{path[2]}}'
        helm:
          valueFiles:
          - values.yaml
          - '{{path.filename}}'  # e.g., values-dev-test-branch.yaml

      destination:
        name: kind-dev
        namespace: '{{path[2]}}'

      syncPolicy:
        automated:
          prune: true      # Auto-delete when values file removed
          selfHeal: true
        syncOptions:
        - CreateNamespace=false  # Branch versions reuse existing namespace
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
