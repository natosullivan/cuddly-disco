name: Branch Builds

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

# Default permissions - restrictive by default
permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changes
        run: |
          # Get the base branch (usually main)
          BASE_BRANCH="origin/main"

          # Check if main branch exists
          if ! git rev-parse --verify $BASE_BRANCH >/dev/null 2>&1; then
            echo "Base branch not found, checking all files"
            FRONTEND_CHANGED=true
            BACKEND_CHANGED=true
          else
            # Get list of changed files compared to main
            CHANGED_FILES=$(git diff --name-only $BASE_BRANCH...HEAD)

            echo "Changed files:"
            echo "$CHANGED_FILES"

            # Check if frontend files changed
            if echo "$CHANGED_FILES" | grep -q "^apps/frontend/"; then
              FRONTEND_CHANGED=true
              echo "✅ Frontend changes detected"
            else
              FRONTEND_CHANGED=false
              echo "ℹ️ No frontend changes"
            fi

            # Check if backend files changed
            if echo "$CHANGED_FILES" | grep -q "^apps/backend/"; then
              BACKEND_CHANGED=true
              echo "✅ Backend changes detected"
            else
              BACKEND_CHANGED=false
              echo "ℹ️ No backend changes"
            fi
          fi

          # Set outputs
          echo "frontend=$FRONTEND_CHANGED" >> $GITHUB_OUTPUT
          echo "backend=$BACKEND_CHANGED" >> $GITHUB_OUTPUT

  get-version-info:
    name: Get Version Info
    runs-on: ubuntu-latest
    needs: detect-changes
    # Only run if at least one app changed
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.backend == 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}
      sanitized-branch: ${{ steps.version.outputs.sanitized-branch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version string
        id: version
        run: |
          # Get the base version from latest git tag, or use package.json version
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            BASE_VERSION=$(git describe --tags --abbrev=0)
            # Remove 'v' prefix if present
            BASE_VERSION=${BASE_VERSION#v}
          else
            # Fallback to package.json version
            BASE_VERSION=$(grep -o '"version": *"[^"]*"' package.json | head -1 | cut -d'"' -f4)
          fi

          # Get current branch name
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          # Sanitize branch name using our script
          chmod +x infrastructure/sanitize-branch-name.sh
          SANITIZED_BRANCH=$(infrastructure/sanitize-branch-name.sh "$BRANCH_NAME")

          # Create version string: vX.X.X-sanitized-branch-name
          VERSION="v${BASE_VERSION}-${SANITIZED_BRANCH}"

          echo "Base version: $BASE_VERSION"
          echo "Branch name: $BRANCH_NAME"
          echo "Sanitized branch: $SANITIZED_BRANCH"
          echo "Full version: $VERSION"

          # Set outputs
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sanitized-branch=$SANITIZED_BRANCH" >> $GITHUB_OUTPUT

  build-branch-frontend:
    name: Build Frontend (Branch)
    runs-on: ubuntu-latest
    needs: [detect-changes, get-version-info]
    # Only run if frontend changed
    if: needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: apps/frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ needs.get-version-info.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image published
        run: |
          echo "✅ Frontend image published:"
          echo "   ghcr.io/${{ github.repository }}/frontend:${{ needs.get-version-info.outputs.version }}"

  build-branch-backend:
    name: Build Backend (Branch)
    runs-on: ubuntu-latest
    needs: [detect-changes, get-version-info]
    # Only run if backend changed
    if: needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: apps/backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ needs.get-version-info.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image published
        run: |
          echo "✅ Backend image published:"
          echo "   ghcr.io/${{ github.repository }}/backend:${{ needs.get-version-info.outputs.version }}"

  update-branch-helm-values:
    name: Update Branch Helm Values
    runs-on: ubuntu-latest
    needs: [detect-changes, get-version-info, build-branch-frontend, build-branch-backend]
    # Run if at least one build succeeded
    if: always() && (needs.build-branch-frontend.result == 'success' || needs.build-branch-backend.result == 'success')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate Helm values files
        env:
          VERSION: ${{ needs.get-version-info.outputs.version }}
          SANITIZED_BRANCH: ${{ needs.get-version-info.outputs.sanitized-branch }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
          FRONTEND_BUILD_SUCCESS: ${{ needs.build-branch-frontend.result == 'success' }}
          BACKEND_BUILD_SUCCESS: ${{ needs.build-branch-backend.result == 'success' }}
        run: |
          # Validate required variables
          if [ -z "$VERSION" ] || [ -z "$SANITIZED_BRANCH" ]; then
            echo "❌ Error: VERSION or SANITIZED_BRANCH not set"
            exit 1
          fi

          echo "📝 Generating Helm values files..."
          echo "Version: $VERSION"
          echo "Branch: $SANITIZED_BRANCH"
          echo "Frontend changed: $FRONTEND_CHANGED"
          echo "Backend changed: $BACKEND_CHANGED"
          echo "Frontend build success: $FRONTEND_BUILD_SUCCESS"
          echo "Backend build success: $BACKEND_BUILD_SUCCESS"

          # Generate frontend values file if frontend build succeeded
          if [ "$FRONTEND_BUILD_SUCCESS" = "true" ]; then
            FRONTEND_VALUES_FILE="k8s/team-apps/frontend/branches/dev-${SANITIZED_BRANCH}.yaml"

            # Determine backend URL based on what changed
            if [ "$BACKEND_CHANGED" = "true" ] && [ "$BACKEND_BUILD_SUCCESS" = "true" ]; then
              # Both frontend and backend changed - use branch-specific backend
              BACKEND_URL="http://backend-${SANITIZED_BRANCH}.backend.svc.cluster.local:5000"
              echo "Backend URL: $BACKEND_URL (branch-specific)"
            else
              # Only frontend changed - use default backend
              BACKEND_URL="http://backend-service.backend.svc.cluster.local:5000"
              echo "Backend URL: $BACKEND_URL (default)"
            fi

            # Create branches directory if it doesn't exist
            mkdir -p k8s/team-apps/frontend/branches

            # Generate values file from template
            cat > "$FRONTEND_VALUES_FILE" <<EOF
          # Auto-generated branch deployment values
          # Branch: ${SANITIZED_BRANCH}
          # Version: ${VERSION}
          # Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          # DO NOT EDIT - This file is automatically generated by CI

          # Version configuration
          version:
            name: "${SANITIZED_BRANCH}"
            isDefault: false  # Branch versions require X-Version header

          # Namespace configuration
          namespace:
            create: false  # Reuse existing namespace from v1 deployment

          # Image configuration
          image:
            repository: ghcr.io/natosullivan/cuddly-disco/frontend
            tag: "${VERSION}"
            pullPolicy: Always  # Always pull to get latest branch builds

          # Single replica for branch versions
          replicaCount: 1

          # Dev gateway hostname (same as v1, routing by header)
          gateway:
            hostname: dev.cuddly-disco.ai.localhost

          # Frontend configuration
          config:
            location: "Development (branch: ${SANITIZED_BRANCH})"
            backendUrl: "${BACKEND_URL}"

          # Lower resource limits for branch versions
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          EOF

            echo "✅ Generated frontend values: $FRONTEND_VALUES_FILE"
          fi

          # Generate backend values file if backend build succeeded
          if [ "$BACKEND_BUILD_SUCCESS" = "true" ]; then
            BACKEND_VALUES_FILE="k8s/team-apps/backend/branches/dev-${SANITIZED_BRANCH}.yaml"

            # Create branches directory if it doesn't exist
            mkdir -p k8s/team-apps/backend/branches

            # Generate values file from template
            cat > "$BACKEND_VALUES_FILE" <<EOF
          # Auto-generated branch deployment values
          # Branch: ${SANITIZED_BRANCH}
          # Version: ${VERSION}
          # Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          # DO NOT EDIT - This file is automatically generated by CI

          # Version configuration
          version:
            name: "${SANITIZED_BRANCH}"
            isDefault: false  # Branch versions require X-Version header

          # Namespace configuration
          namespace:
            create: false  # Reuse existing namespace from v1 deployment

          # Image configuration
          image:
            repository: ghcr.io/natosullivan/cuddly-disco/backend
            tag: "${VERSION}"
            pullPolicy: Always  # Always pull to get latest branch builds

          # Service configuration - unique service per branch
          service:
            name: "backend-${SANITIZED_BRANCH}"

          # Single replica for branch versions
          replicaCount: 1

          # Lower resource limits for branch versions
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          EOF

            echo "✅ Generated backend values: $BACKEND_VALUES_FILE"
          fi

      - name: Commit and push changes
        env:
          SANITIZED_BRANCH: ${{ needs.get-version-info.outputs.sanitized-branch }}
          VERSION: ${{ needs.get-version-info.outputs.version }}
          FRONTEND_BUILD_SUCCESS: ${{ needs.build-branch-frontend.result == 'success' }}
          BACKEND_BUILD_SUCCESS: ${{ needs.build-branch-backend.result == 'success' }}
        run: |
          # Stage generated files
          git add k8s/team-apps/frontend/branches/dev-${SANITIZED_BRANCH}.yaml 2>/dev/null || true
          git add k8s/team-apps/backend/branches/dev-${SANITIZED_BRANCH}.yaml 2>/dev/null || true

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "ℹ️  No changes to commit (files already up to date)"
            exit 0
          fi

          # Show what changed
          echo "📝 Changes to commit:"
          git diff --staged --stat

          # Determine which files were updated
          FRONTEND_STATUS="⏭️ skipped"
          BACKEND_STATUS="⏭️ skipped"
          if [ "$FRONTEND_BUILD_SUCCESS" = "true" ]; then
            FRONTEND_STATUS="✅ updated"
          fi
          if [ "$BACKEND_BUILD_SUCCESS" = "true" ]; then
            BACKEND_STATUS="✅ updated"
          fi

          # Commit with descriptive message
          git commit -m "chore(helm): Update branch values for ${SANITIZED_BRANCH} to ${VERSION} [skip ci]

          Auto-generated Helm values files:
          - Frontend: ${FRONTEND_STATUS}
          - Backend: ${BACKEND_STATUS}

          Generated by GitHub Actions
          Workflow: ${GITHUB_WORKFLOW}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Push to feature/branch-versioning branch (for testing)
          # TODO: Change to 'main' before merging to production
          git push origin HEAD:feature/branch-versioning

          echo "✅ Changes committed and pushed successfully"
